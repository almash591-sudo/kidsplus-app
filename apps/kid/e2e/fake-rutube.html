<!doctype html>
<!--
  Подмена https://rutube.ru/play/embed/<id>/ в e2e-тестах (этап 54). Страница открывается с
  origin rutube.ru, как настоящий плеер, и говорит с приложением теми же сообщениями
  postMessage. Тест управляет ею через window.__rt внутри iframe.
-->
<html>
  <body style="margin: 0; background: #123">
    <script>
      (() => {
        const q = new URLSearchParams(location.search);
        // Safari на iPhone: команда play из приложения не запускает видео, нужно касание по
        // самому плееру. Тест подменяет на true.
        const needsFrameTap = false;
        const post = (type, data = {}) => parent.postMessage(JSON.stringify({ type, data }), '*');
        const rt = {
          id: location.pathname.split('/').filter(Boolean).pop(),
          start: Number(q.get('t') ?? 0),
          stop: Number(q.get('stopTime') ?? 0),
          time: Number(q.get('t') ?? 0),
          state: 'stopped',
          calls: [],
          hits: 0,
          set(state) {
            this.state = state;
            post('player:changeState', { state });
          },
          at(time) {
            this.time = time;
            post('player:currentTime', { time, duration: 600 });
          },
          complete() {
            post('player:playComplete');
          },
          fail(message) {
            post('player:error', { message });
          },
        };
        window.__rt = rt;
        addEventListener('message', (e) => {
          let m;
          try {
            m = JSON.parse(e.data);
          } catch {
            return;
          }
          rt.calls.push(m.type);
          if (m.type === 'player:play' && !needsFrameTap) rt.set('playing');
          if (m.type === 'player:pause') rt.set('pause');
          if (m.type === 'player:setCurrentTime') rt.at(m.data.time);
        });
        // Касания, дошедшие до «RuTube». Должно оставаться 0, кроме открытого центра на iPhone.
        document.addEventListener('pointerdown', () => (rt.hits += 1));
        document.addEventListener('click', () => needsFrameTap && rt.set('playing'));
        setTimeout(() => post('player:ready', { videoId: rt.id }), 20);
      })();
    </script>
  </body>
</html>
