name: CI

# Экономия минут (приватный репозиторий, бесплатный лимит): ветки PR проверяются один раз —
# через pull_request; push — только в main (после него Railway деплоит). Новый push в PR
# отменяет незаконченную проверку. Правки только документации CI не запускают.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: kidsplus
          POSTGRES_PASSWORD: kidsplus
          POSTGRES_DB: kidsplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidsplus"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kidsplus:kidsplus@localhost:5432/kidsplus
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Автокэш по packageManager требует pnpm до corepack enable — отключаем.
          package-manager-cache: false
      - run: corepack enable
      - id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      # Собранные api и worker должны загрузиться (все импорты из бандла и node_modules разрешаются)
      # и дойти до проверки окружения. Ловит вшитые в бандл CommonJS-зависимости (как web-push).
      - name: Бандлы загружаются
        run: |
          for app in api worker; do
            out=$(env -i PATH="$PATH" node apps/$app/dist/index.js 2>&1 || true)
            echo "$out" | grep -q 'Некорректные переменные окружения' || { echo "$app:"; echo "$out" | head -20; exit 1; }
          done

  # Сквозные тесты детского сценария (Playwright, эмуляция Galaxy S20+).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Детское приложение и общие пакеты не менялись — сквозные тесты не нужны.
      - id: changed
        run: bash .github/changed.sh '^(apps/kid/|packages/|pnpm-lock\.yaml|package\.json|\.github/)'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - if: steps.changed.outputs.run == 'true'
        run: corepack enable
      - id: pnpm-store
        if: steps.changed.outputs.run == 'true'
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.changed.outputs.run == 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: bash .github/pw-install.sh @kidsplus/kid chromium
      - if: steps.changed.outputs.run == 'true'
        run: pnpm --filter @kidsplus/kid e2e --project s20-portrait --project s20-landscape
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/kid/playwright-report
          retention-days: 7

  # Детское приложение на iPhone (этап 27): Safari-движок WebKit, iPhone 15 и iPhone SE.
  e2e-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Детское приложение и общие пакеты не менялись — сквозные тесты не нужны.
      - id: changed
        run: bash .github/changed.sh '^(apps/kid/|packages/|pnpm-lock\.yaml|package\.json|\.github/)'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - if: steps.changed.outputs.run == 'true'
        run: corepack enable
      - id: pnpm-store
        if: steps.changed.outputs.run == 'true'
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.changed.outputs.run == 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: bash .github/pw-install.sh @kidsplus/kid webkit
      - if: steps.changed.outputs.run == 'true'
        run: pnpm --filter @kidsplus/kid e2e --project iphone-15 --project iphone-se
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-iphone
          path: apps/kid/playwright-report
          retention-days: 7

  # Кабинет на телефонах (этап 24): Safari-движок с экранами iPhone и узкий Android, демо-стенд на PGlite.
  e2e-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/changed.sh '^(apps/parent/|apps/landing/|apps/api/|packages/|pnpm-lock\.yaml|package\.json|\.github/)'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - if: steps.changed.outputs.run == 'true'
        run: corepack enable
      - id: pnpm-store
        if: steps.changed.outputs.run == 'true'
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.changed.outputs.run == 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: bash .github/pw-install.sh @kidsplus/parent webkit chromium
      - if: steps.changed.outputs.run == 'true'
        run: pnpm --filter @kidsplus/parent e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-phone
          path: apps/parent/playwright-report
          retention-days: 7

  # Киоск для детских телефонов (Android, этап 6): unit-тесты VPN и сборка APK.
  kiosk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Киоск собирается только если менялся он сам или сборка libbox — это самая долгая проверка.
      - id: changed
        run: bash .github/changed.sh '^(apps/kiosk/|scripts/build-libbox\.sh|\.github/)'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        if: steps.changed.outputs.run == 'true'
        with:
          go-version: '1.25'
          cache: false
      # sing-box libbox собирается из исходников ~10 минут — кэш по версии.
      - id: libbox
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: apps/kiosk/android/app/libs/libbox.aar
          key: libbox-1.14.3-arm64-v1
      - name: libbox (sing-box)
        if: steps.changed.outputs.run == 'true' && steps.libbox.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash scripts/build-libbox.sh
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
        if: steps.changed.outputs.run == 'true'
      - run: pnpm install --frozen-lockfile --filter @kidsplus/kiosk
        if: steps.changed.outputs.run == 'true'
      - run: pnpm --filter @kidsplus/kiosk exec cap sync android
        if: steps.changed.outputs.run == 'true'
      - name: Тесты и сборка APK
        if: steps.changed.outputs.run == 'true'
        working-directory: apps/kiosk/android
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon
