name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: kidsplus
          POSTGRES_PASSWORD: kidsplus
          POSTGRES_DB: kidsplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidsplus"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kidsplus:kidsplus@localhost:5432/kidsplus
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Автокэш по packageManager требует pnpm до corepack enable — отключаем.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      # Собранные api и worker должны загрузиться (все импорты из бандла и node_modules разрешаются)
      # и дойти до проверки окружения. Ловит вшитые в бандл CommonJS-зависимости (как web-push).
      - name: Бандлы загружаются
        run: |
          for app in api worker; do
            out=$(env -i PATH="$PATH" node apps/$app/dist/index.js 2>&1 || true)
            echo "$out" | grep -q 'Некорректные переменные окружения' || { echo "$app:"; echo "$out" | head -20; exit 1; }
          done

  # Сквозные тесты детского сценария (Playwright, эмуляция Galaxy S20+).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kidsplus/kid exec playwright install --with-deps chromium
      - run: pnpm --filter @kidsplus/kid e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/kid/playwright-report
          retention-days: 7

  # Киоск для детских телефонов (Android, этап 6): unit-тесты VPN и сборка APK.
  kiosk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      # sing-box libbox собирается из исходников ~10 минут — кэш по версии.
      - id: libbox
        uses: actions/cache@v4
        with:
          path: apps/kiosk/android/app/libs/libbox.aar
          key: libbox-1.14.3-arm64-v1
      - name: libbox (sing-box)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash scripts/build-libbox.sh
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --filter @kidsplus/kiosk
      - run: pnpm --filter @kidsplus/kiosk exec cap sync android
      - name: Тесты и сборка APK
        working-directory: apps/kiosk/android
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon
